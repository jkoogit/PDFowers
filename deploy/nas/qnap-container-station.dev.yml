name: pdfowers-dev

services:
  pdfowers_dev:
    image: ghcr.io/jkoogit/pdfowers:dev
    pull_policy: always
    container_name: pdfowers_dev
    restart: unless-stopped
    ports:
      - "${PDFOWERS_DEV_PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      APP_ENV: dev
      PORT: "4173"
      NPM_CONFIG_OPTIONAL: "true"
      DATABASE_URL: ${DATABASE_URL}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      APP_BASE_URL: ${APP_BASE_URL}
      KAKAO_REDIRECT_PATH: ${KAKAO_REDIRECT_PATH:-/auth/kakao/callback}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_SCOPE: ${KAKAO_SCOPE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:4173/auth/kakao/config-status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
