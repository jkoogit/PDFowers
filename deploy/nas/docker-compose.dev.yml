services:
  pdfowers_dev:
    image: ghcr.io/jkoogit/pdfowers:dev
    pull_policy: always
    restart: unless-stopped
    container_name: pdfowers_dev
    ports:
      - "${PDFOWERS_DEV_PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      APP_ENV: dev
      PORT: "4173"
      NPM_CONFIG_OPTIONAL: ${NPM_CONFIG_OPTIONAL:-true}
      DATABASE_URL: ${DATABASE_URL}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      APP_BASE_URL: ${APP_BASE_URL}
      KAKAO_REDIRECT_PATH: ${KAKAO_REDIRECT_PATH:-/auth/kakao/callback}
      KAKAO_ALLOWED_REDIRECT_ORIGINS: ${KAKAO_ALLOWED_REDIRECT_ORIGINS:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_SCOPE: ${KAKAO_SCOPE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    healthcheck:
      test:
        - CMD-SHELL
        - "node dist/src/review/kakao-smoke-check.js --base-url http://127.0.0.1:4173"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
